# Production profile
# Read database settings from environment variables expected in Docker/runtime.
spring.datasource.url=jdbc:mysql://${DATABASE_URL}:${DATABASE_PORT:3306}/${DATABASE_NAME}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=false&publicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8092}

# Trust the reverse proxy's X-Forwarded-* headers (Azure App Service terminates
# HTTPS and forwards to the container over plain HTTP) so Spring and springdoc
# see the real external scheme/host instead of defaulting to http.
server.forward-headers-strategy=framework

# JWT secret must be provided as an environment variable in production.
authorization.jwt.secret=${JWT_SECRET}
